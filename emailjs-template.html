<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Inquiry</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #111827;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      line-height: 1.6;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
    }
    .logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.05em;
      color: #111827;
      margin-bottom: 48px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-top: 0;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    p.subtitle {
      color: #6B7280;
      font-size: 15px;
      margin-top: 0;
      margin-bottom: 40px;
    }
    .details {
      margin-bottom: 40px;
    }
    .detail-item {
      margin-bottom: 16px;
    }
    .detail-label {
      font-size: 13px;
      color: #6B7280;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }
    .detail-value {
      font-size: 16px;
      font-weight: 500;
    }
    .detail-value a {
      color: #2563EB;
      text-decoration: none;
    }
    .message-box {
      background-color: #F9FAFB;
      border: 1px solid #E5E7EB;
      border-radius: 12px;
      padding: 24px;
      font-size: 15px;
      color: #374151;
      white-space: pre-wrap;
    }
    .footer {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid #E5E7EB;
      font-size: 13px;
      color: #9CA3AF;
    }
  </style>
</head>
<body>
  <div class="container">
    
    <div class="logo">Zellio.</div>

    <h1>New Project Inquiry</h1>
    <p class="subtitle">You have received a new contact submission from your website.</p>

    <div class="details">
      <div class="detail-item">
        <div class="detail-label">Name</div>
        <div class="detail-value">{{name}}</div>
      </div>
      
      <div class="detail-item">
        <div class="detail-label">Company</div>
        <div class="detail-value">{{company}}</div>
      </div>

      <div class="detail-item">
        <div class="detail-label">Email</div>
        <div class="detail-value"><a href="mailto:{{email}}">{{email}}</a></div>
      </div>

      <div class="detail-item">
        <div class="detail-label">Phone</div>
        <div class="detail-value">{{phone}}</div>
      </div>
    </div>

    <div class="detail-item">
      <div class="detail-label">Project Brief</div>
      <div class="message-box">{{message}}</div>
    </div>

    <div class="footer">
      Sent from Zellio Website &bull; internal notification
    </div>

  </div>
</body>
</html>
